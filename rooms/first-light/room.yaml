meta:
  id: first-light
  title: The First Light
  author: Party Games Server
  difficulty: easy
  est_minutes: 15
  team_size: "1-8"
  tags:
    - starter
    - teamwork
settings:
  time_limit_min: 20
  hint_penalty_sec: 60
  wrong_answer_cooldown_sec: 5
story:
  intro: "The old observatory is dark. Three instruments still hold a trace of the last astronomer's work. Read each carefully and combine what you discover to bring the beacon back to life."
  outro: "The beacon blooms across the night sky. Somewhere in the distance, a second light answers."
puzzles:
  - id: compass
    title: The Compass
    type: text
    prestory: "A brass compass rests beside a note."
    prompt: "The note says: 'At sunrise, face the direction from which the sun appears.' Which direction is it?"
    requires: []
    answers:
      - east
    hints:
      - "Think about where the sun rises."
      - "The sun rises in the east."
      - "Enter the four-letter direction."
    solve_text: "The compass points east."
    gives: east
  - id: spectrum
    title: The Spectrum
    type: multiple_choice
    prestory: "A prism hangs over a faded color wheel."
    prompt: "Which color is made by combining blue and yellow pigments?"
    options:
      - red
      - green
      - violet
    answer: green
    requires: []
    hints:
      - "Blue and yellow pigments combine to make a secondary color."
      - "It is a familiar color of leaves."
      - "Choose green."
    solve_text: "A green ray shines through the prism."
    gives: green
  - id: rhythm
    title: The Rhythm
    type: ordering
    prestory: "Three marks are scratched into the observatory door."
    prompt: "Put the phases of the moon in order from earliest to latest."
    items:
      - new moon
      - first quarter
      - full moon
    answer: ordered
    requires: []
    hints:
      - "The moon begins this cycle when it is not visible."
      - "Half illuminated comes before fully illuminated."
      - "Order: new, first quarter, full."
    solve_text: "The marks align into a clear lunar sequence."
    gives: full moon
  - id: night-sky
    title: The Night Sky
    type: split_clue
    prestory: "A celestial chart is torn into pieces and shared among the crew."
    prompt: "Combine the fragments your teammates found to name the bright object."
    fragments:
      - "A bright point that shines in the night sky."
      - "Its name begins with S and ends with R."
    answer: star
    requires: []
    hints:
      - "Compare your clue with a teammate's fragment."
      - "The fragments describe a familiar object in the night sky."
      - "The answer is star."
    solve_text: "The scattered star chart pieces form a single constellation."
    gives: star
  - id: beacon
    title: The Beacon
    type: meta
    prestory: "The three instruments have opened the beacon's control panel."
    prompt: "Combine the direction, color, moon phase, and object you discovered."
    answer: "east green full moon star"
    requires:
      - compass
      - spectrum
      - rhythm
      - night-sky
    hints:
      - "Use the four clues in the order named in the prompt."
      - "Your clues are east, green, full moon, and star."
      - "Enter: east green full moon star."
    solve_text: "The observatory beacon has been restored."
