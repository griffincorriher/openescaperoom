meta:
  id: first-light
  title: The First Light
  author: Party Games Server
  difficulty: easy
  est_minutes: 20
  team_size: "1-8"
  tags:
    - starter
    - teamwork
settings:
  time_limit_min: 20
  hint_penalty_sec: 60
  wrong_answer_cooldown_sec: 5
story:
  intro: "The old observatory is dark. Six traces of the last astronomer's work remain among its instruments and charts. Read each carefully and combine what you discover to bring the beacon back to life."
  outro: "The beacon blooms across the night sky. Somewhere in the distance, a second light answers."
puzzles:
  - id: compass
    title: The Compass
    type: text
    prestory: "A brass compass rests beside a note."
    prompt: "The note says: 'At sunrise, face the direction from which the sun appears.' Which direction is it?"
    requires: []
    answers:
      - east
    hints:
      - "Think about where the sun rises."
      - "The sun rises in the east."
      - "Enter the four-letter direction."
    solve_text: "The compass points east."
    gives: east
  - id: spectrum
    title: The Spectrum
    type: multiple_choice
    prestory: "A prism hangs over a faded color wheel."
    prompt: "Which color is made by combining blue and yellow pigments?"
    options:
      - red
      - green
      - violet
    answer: green
    requires: []
    hints:
      - "Blue and yellow pigments combine to make a secondary color."
      - "It is a familiar color of leaves."
      - "Choose green."
    solve_text: "A green ray shines through the prism."
    gives: green
  - id: rhythm
    title: The Rhythm
    type: ordering
    prestory: "Three marks are scratched into the observatory door."
    prompt: "Put the phases of the moon in order from earliest to latest."
    items:
      - new moon
      - first quarter
      - full moon
    answer: ordered
    requires: []
    hints:
      - "The moon begins this cycle when it is not visible."
      - "Half illuminated comes before fully illuminated."
      - "Order: new, first quarter, full."
    solve_text: "The marks align into a clear lunar sequence."
    gives: full moon
  - id: night-sky
    title: The Night Sky
    type: split_clue
    prestory: "A celestial chart is torn into pieces and shared among the crew."
    prompt: "Combine the fragments your teammates found to name the bright object."
    fragments:
      - "A bright point that shines in the night sky."
      - "Its name begins with S and ends with R."
    answer: star
    requires: []
    hints:
      - "Compare your clue with a teammate's fragment."
      - "The fragments describe a familiar object in the night sky."
      - "The answer is star."
    solve_text: "The scattered star chart pieces form a single constellation."
    gives: star
  - id: instrument-rack
    title: The Instrument Rack
    type: matching
    prestory: "Four observatory instruments stand ready beneath a dusty star chart."
    prompt: "Match each instrument to the observation it was designed to make."
    left:
      - The telescope
      - The spectroscope
      - The radio dish
      - The clock
    right:
      - A star's position in the sky
      - The colors within starlight
      - Signals from distant stars
      - The hour of an observation
    answer: paired
    requires: []
    hints:
      - "Think about what each instrument measures or receives."
      - "A spectroscope separates light into colors; a radio dish receives signals."
      - "Pair telescope-position, spectroscope-colors, dish-signals, and clock-hour."
    solve_text: "The instruments hum together, tuning the beacon to a distant signal."
    gives: signal
  - id: beacon-circuit
    title: The Beacon Circuit
    type: pick_all
    prestory: "A tray of components waits beside the beacon's control panel."
    prompt: "Select every component needed to send a focused beam of light into the sky."
    options:
      - A power source
      - A lamp
      - A focusing lens
      - A wool blanket
      - An empty inkwell
    answer:
      - A power source
      - A lamp
      - A focusing lens
    requires: []
    hints:
      - "Choose the parts that make light and shape its path."
      - "The beacon needs energy, something that shines, and something to focus it."
      - "Select the power source, lamp, and focusing lens."
    solve_text: "The circuit closes, and a narrow beam cuts through the darkness."
    gives: light
  - id: beacon
    title: The Beacon
    type: meta
    prestory: "Your discoveries reveal the beacon's final control sequence."
    prompt: "Combine the direction, color, moon phase, object, signal, and beam you discovered, in that order."
    answer: "east green full moon star signal light"
    requires:
      - compass
      - spectrum
      - rhythm
      - night-sky
      - instrument-rack
      - beacon-circuit
    hints:
      - "Use the six clues in the order named in the prompt."
      - "Your discoveries are east, green, full moon, star, signal, and light."
      - "Enter: east green full moon star signal light."
    solve_text: "The observatory beacon has been restored."
